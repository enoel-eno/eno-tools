<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>エフェクト画像メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: control sheet on the left, live animated preview on the right; stacks on phones. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#1f2328; --muted:#6b7178; --line:#dde1e5; --accent:#2b2f36; --accent-fg:#ffffff;
  --f-ui:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-disp:"Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-mono:"JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1e2125; --fg:#e6e8ea; --muted:#9aa0a6; --line:#30343a; --accent:#d5d9de; --accent-fg:#15171a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1e2125; --fg:#e6e8ea; --muted:#9aa0a6; --line:#30343a; --accent:#d5d9de; --accent-fg:#15171a; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--f-ui); font-size:14px; line-height:1.6}
.wrap{max-width:1440px; margin:0 auto; padding-block:28px 48px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; gap:20px}
header{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px}
h1{margin:0; font-family:var(--f-disp); font-size:28px; font-weight:800; letter-spacing:.08em; text-wrap:balance}
header p{margin:0; color:var(--muted)}
.grid{display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start}
.controls{flex:1 1 340px; max-width:440px; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 18px; display:flex; flex-direction:column; gap:4px}
.preview{flex:999 1 420px; min-width:0; display:flex; flex-direction:column; gap:12px; position:sticky; top:12px}
@media (max-width:900px){
  .controls{max-width:none}
  .grid{gap:12px}
  .preview{order:-1; flex:1 1 100%; z-index:5; background:var(--bg); padding-block:8px; gap:8px; box-shadow:0 1px 0 var(--line)}
  .preview .stage{height:min(34vh, 280px); min-height:0}
  .preview canvas{max-height:calc(min(34vh, 280px) - 24px)}
}
fieldset{border:0; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; min-width:0}
.sec{border-top:1px solid var(--line); padding-top:4px}
.sec:first-child{border-top:0; padding-top:0}
.sec > summary{list-style:none; display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px; cursor:pointer; font-size:13px; font-weight:700; letter-spacing:.12em; color:var(--fg); border-radius:6px}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::after{content:""; width:8px; height:8px; border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted); margin-right:4px; transform:rotate(45deg); transition:transform .15s}
.sec:not([open]) > summary::after{transform:rotate(-45deg)}
.sec > summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.sec > fieldset{padding-bottom:14px}
.row{display:flex; gap:10px}
.row > label{flex:1 1 0; min-width:0}
label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted)}
label.inline{flex-direction:row; align-items:center; justify-content:space-between; gap:10px}
label span.v{font-family:var(--f-mono); color:var(--fg)}
select{font:inherit; font-size:14px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; min-height:40px; width:100%}
select:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
input[type=range]{width:100%; accent-color:var(--accent)}
input[type=color]{width:56px; height:36px; padding:2px; border:1px solid var(--line); border-radius:6px; background:var(--bg); cursor:pointer}
input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent)}
.seg{display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{flex:1 1 20%; min-height:40px; border:0; background:var(--bg); color:var(--fg); font:inherit; font-size:13px; cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--bg)}
.sub{font-size:12px; color:var(--muted); margin:0}
.pick{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.pick .name{font-size:12px; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 120px}

/* effect cards */
.fxgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px}
.fx{border:1px solid var(--line); border-radius:8px; background:var(--bg); display:flex; flex-direction:column; min-width:0; transition:border-color .15s}
.fx:hover{border-color:var(--accent)}
.fx.on{border-color:var(--accent)}
.fxbtn{min-height:42px; border:0; background:transparent; color:var(--fg); font:inherit; font-size:13px; text-align:left; padding:6px 10px; cursor:pointer; border-radius:8px; display:flex; align-items:center; gap:8px}
.fxbtn::before{content:""; flex:none; width:12px; height:12px; border:1.5px solid var(--muted); border-radius:50%}
.fx.on .fxbtn{font-weight:700}
.fx.on .fxbtn::before{background:var(--accent); border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--bg)}
.fxbtn:disabled{opacity:.45; cursor:not-allowed}
.fxopt{display:flex; align-items:center; gap:8px; padding:0 10px 8px}
.fxopt[hidden]{display:none}
.fxopt input[type=range]{flex:1 1 auto; min-width:0}
.fxopt input[type=color]{width:32px; height:26px; flex:none}
.fxt span{font-size:11px; color:var(--muted); width:2.4em; flex:none}
.fxt small{width:3.4em !important}
.fxopt small{font-family:var(--f-mono); font-size:11px; color:var(--muted); width:2.2em; text-align:right; flex:none}
.fxtools{display:flex; gap:8px; flex-wrap:wrap}

.stage{position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; min-height:300px; background:repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0/16px 16px; border-radius:8px; border:1px solid var(--line); padding:12px}
.stage.light{background:#fff}
.stage.dark{background:#111}
.stage canvas{display:block; max-width:100%; max-height:calc(100vh - 300px); min-height:0; width:auto; height:auto; object-fit:contain; margin:auto}
.empty{position:absolute; inset:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; color:var(--muted); border:1.5px dashed var(--line); border-radius:8px; background:var(--panel); padding:16px}
.empty[hidden]{display:none}
.empty svg{width:28px; height:28px}
.stage.drag .empty, .stage.drag{border-color:var(--accent)}
.bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.bar small{color:var(--muted); font-family:var(--f-mono); font-size:12px}
.btns{display:flex; flex-wrap:wrap; gap:10px}
.btn{min-height:44px; padding:0 22px; border-radius:8px; border:0; background:var(--accent); color:var(--accent-fg); font:inherit; font-weight:700; font-size:15px; letter-spacing:.06em; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:500}
.btn.small{min-height:36px; padding:0 14px; font-size:13px}
.status{min-height:1.6em; color:var(--muted); font-size:13px; margin:0}
.result{border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:10px 14px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px}
.result[hidden]{display:none}
.meta{display:flex; flex-wrap:wrap; gap:6px 16px; font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.progress{height:4px; background:var(--line); border-radius:2px; overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--accent)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
@media (max-width:520px){header h1{font-size:calc((100vw - 32px)/11);white-space:nowrap}}
</style>
<meta name="description" content="画像を拡大して、枠の中でパンやズームさせた動くAPNG / WebPを作ります。"><meta name="robots" content="noindex, nofollow"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <a href="./" style="display:inline-block;margin-bottom:6px;font-size:13px;color:var(--muted);text-decoration:none">← ツール一覧</a>
  <header>
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:.85em;height:.85em;vertical-align:-.08em;margin-right:.3em"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>エフェクト画像メーカー</h1>
    <p>画像を拡大して、枠の中で動かし、ぼかしやグリッチ、フィルム風の効果をつけた動くAPNG / WebPにします。</p>
  </header>

  <div class="grid">
    <form class="controls" id="form" autocomplete="off" onsubmit="return false">
      <details class="sec" open>
        <summary>画像</summary>
        <fieldset aria-label="画像">
          <div class="pick">
            <button type="button" class="btn small" id="pickBtn">画像を選ぶ</button>
            <span class="name" id="fname">未選択</span>
          </div>
          <input type="file" id="file" accept="image/*" hidden>
          <p class="sub">ドラッグ＆ドロップや、貼り付け（Ctrl+V）でも読み込めます。</p>
          <label class="inline" for="dot">ドット絵モード（拡大時に補間しない） <input type="checkbox" id="dot"></label>
        </fieldset>
      </details>

      <details class="sec" open>
        <summary>カメラ（枠の中で動かす）</summary>
        <fieldset aria-label="カメラ">
          <label for="cam">動き
            <select id="cam"></select>
          </label>
          <label for="zoom">拡大率 <span class="v" id="zoomVal"></span>
            <input type="range" id="zoom" min="100" max="400" step="5">
          </label>
          <label for="range" id="rangeLabel">動く範囲 <span class="v" id="rangeVal"></span>
            <input type="range" id="range" min="10" max="100" step="5">
          </label>
          <div id="modeBox">
            <label style="margin-bottom:4px">進み方</label>
            <div class="seg" role="group" aria-label="進み方" id="modeSeg">
              <button type="button" data-v="oneway">一方向</button>
              <button type="button" data-v="pingpong">行って戻る</button>
            </div>
            <p class="sub" id="modeNote"></p>
          </div>
          <div id="easeBox">
            <label style="margin-bottom:4px">動き方</label>
            <div class="seg" role="group" aria-label="動き方" id="easeSeg">
              <button type="button" data-v="smooth">なめらか</button>
              <button type="button" data-v="linear">一定の速さ</button>
            </div>
          </div>
          <label for="aspect">枠の比率
            <select id="aspect"></select>
          </label>
          <div id="customAsp" class="inline" style="display:flex;align-items:center;gap:6px;margin:-4px 0 10px" hidden>
            <input type="number" id="aw" min="1" max="100" step="1" inputmode="numeric" aria-label="横の比率" style="width:4.5em">
            <span>:</span>
            <input type="number" id="ah" min="1" max="100" step="1" inputmode="numeric" aria-label="縦の比率" style="width:4.5em">
            <span class="sub" style="margin:0">（横 : 縦）</span>
          </div>
          <p class="sub">枠の形に合わせて画像を切り抜き、拡大した画像を枠の中で動かします。拡大するほど、動かせる幅が広がります。</p>
        </fieldset>
      </details>

      <details class="sec" open>
        <summary>効果（重ねがけ）</summary>
        <fieldset aria-label="効果">
          <div class="fxtools">
            <button type="button" class="btn ghost small" id="rand">おまかせ</button>
            <button type="button" class="btn ghost small" id="clear">すべて解除</button>
          </div>
          <p class="sub" id="fxNote">選んだ効果は、カメラの動きに重ねがけされます。</p>
        </fieldset>
      </details>
      <div id="fxGroups"></div>

      <details class="sec" open>
        <summary>出力</summary>
        <fieldset aria-label="出力">
          <div class="seg" role="group" aria-label="形式" id="fmtSeg">
            <button type="button" data-v="apng">APNG</button>
            <button type="button" data-v="webp">アニメWebP</button>
          </div>
          <label for="wq" id="wqLabel">WebPの画質 <span class="v" id="wqVal"></span>
            <input type="range" id="wq" min="50" max="100" step="5">
          </label>
          <label class="inline" for="cap" id="capLabel">5MB以下に自動で調整する（WebP） <input type="checkbox" id="cap"></label>
          <label for="size">大きさ（長辺）
            <select id="size"></select>
          </label>
          <div class="row">
            <label for="dur">長さ <span class="v" id="durVal"></span>
              <input type="range" id="dur" min="0.5" max="8" step="0.1">
            </label>
            <label for="fps">コマ数
              <select id="fps"></select>
            </label>
          </div>
          <div>
            <label style="margin-bottom:4px">1ループ中の動きの回数</label>
            <div class="seg" role="group" aria-label="動きの回数" id="cycSeg">
              <button type="button" data-v="1">1回</button>
              <button type="button" data-v="2">2回</button>
              <button type="button" data-v="3">3回</button>
              <button type="button" data-v="4">4回</button>
            </div>
          </div>
          <label class="inline" for="loop">くり返し再生する <input type="checkbox" id="loop"></label>
          <label class="inline" for="bgOn">背景色をつける（透過画像のとき） <input type="checkbox" id="bgOn"></label>
          <label class="inline" for="bgColor">背景の色 <input type="color" id="bgColor"></label>
        </fieldset>
      </details>

      <details class="sec" open>
        <summary>プレビュー表示</summary>
        <fieldset aria-label="プレビュー表示">
          <p class="sub">画像には影響しません。見やすい下地を選べます。</p>
          <div class="seg" role="group" aria-label="プレビューの下地" id="stageSeg">
            <button type="button" data-v="check">市松</button>
            <button type="button" data-v="light">白</button>
            <button type="button" data-v="dark">黒</button>
          </div>
        </fieldset>
      </details>
    </form>

    <section class="preview" aria-label="プレビュー">
      <div class="stage" id="stage">
        <canvas id="cv" width="10" height="10"></canvas>
        <div class="empty" id="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
          <span>ここに画像をドロップ<br>または貼り付け</span>
          <button type="button" class="btn ghost small" id="pickBtn2">画像を選ぶ</button>
        </div>
      </div>
      <div class="bar">
        <small id="dims"></small>
        <div class="btns">
          <button type="button" class="btn ghost" id="playBtn" disabled>停止</button>
          <button type="button" class="btn" id="make" disabled>動く画像を作成</button>
        </div>
      </div>
      <div class="progress" id="prog" hidden><i id="progBar"></i></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>

      <section class="result" id="result" hidden aria-label="作成結果">
        <div class="meta" id="resMeta"></div>
        <a class="btn" id="resSave" href="#" download>保存する</a>
      </section>
    </section>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const fract = x => x - Math.floor(x);
  const hash = n => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453);
  const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const CAN_FILTER = typeof CanvasRenderingContext2D !== "undefined" && "filter" in CanvasRenderingContext2D.prototype;

  // ---- camera: the frame stays fixed, the (zoomed) image moves inside it ----
  // Each motion returns {px, py in -1..1 (position within the available slack), z (zoom factor)} for the cycle phase.
  const tri = t => { t = fract(t); return t < .25 ? 4 * t : t < .75 ? 2 - 4 * t : 4 * t - 4; };   // sin-like triangle wave
  // k.q runs -1 -> 1 along the path (one-way) or -1 -> 1 -> -1 (round trip). Image moving "right to left" = view moving right.
  const CAMS = [
    {id:"toL", n:"右から左へ", f:(k, Z) => ({px:k.q, py:0, z:Z})},
    {id:"toR", n:"左から右へ", f:(k, Z) => ({px:-k.q, py:0, z:Z})},
    {id:"toU", n:"下から上へ", f:(k, Z) => ({px:0, py:k.q, z:Z})},
    {id:"toD", n:"上から下へ", f:(k, Z) => ({px:0, py:-k.q, z:Z})},
    {id:"toUL", n:"右下から左上へ", f:(k, Z) => ({px:k.q, py:k.q, z:Z})},
    {id:"toUR", n:"左下から右上へ", f:(k, Z) => ({px:-k.q, py:k.q, z:Z})},
    {id:"toDL", n:"右上から左下へ", f:(k, Z) => ({px:k.q, py:-k.q, z:Z})},
    {id:"toDR", n:"左上から右下へ", f:(k, Z) => ({px:-k.q, py:-k.q, z:Z})},
    {id:"zin", n:"ズームイン", f:(k, Z) => ({px:0, py:0, z:1 + (Z - 1) * (k.q + 1) / 2}), noRange:true},
    {id:"zout", n:"ズームアウト", f:(k, Z) => ({px:0, py:0, z:1 + (Z - 1) * (1 - k.q) / 2}), noRange:true},
    {id:"circle", n:"円を描く", f:(k, Z) => ({px:Math.cos(k.w), py:Math.sin(k.w), z:Z}), loopOnly:true},
    {id:"drift", n:"ゆらゆら漂う", f:(k, Z) => ({px:Math.sin(k.w + 1) * .5 + Math.sin(3 * k.w + 2) * .3 + Math.sin(5 * k.w) * .2, py:Math.cos(2 * k.w + .5) * .5 + Math.sin(4 * k.w + 1) * .3, z:Z}), loopOnly:true},
    {id:"still", n:"動かさない（拡大して切り抜くだけ）", f:(k, Z) => ({px:0, py:0, z:Z}), noRange:true, loopOnly:true, noEase:true},
  ];
  const OLD_CAM = {panH:"toL", panV:"toU", panD:"toUL", panD2:"toUR", zoom:"zin", zoomPan:"toL"};
  const BYCAM = Object.fromEntries(CAMS.map(c => [c.id, c]));
  const ASPECTS = [["orig", "元の画像のまま"], ["1:1", "正方形 1:1"], ["4:3", "横長 4:3"], ["3:4", "縦長 3:4"], ["3:2", "横長 3:2"], ["2:3", "縦長 2:3"], ["16:9", "横長 16:9"], ["9:16", "縦長 9:16"], ["21:9", "ワイド 21:9"], ["2:1", "横長 2:1"], ["custom", "自由に指定"]];

  // ---- effect catalogue (overlays on top of the camera image) ----
  // fn(st, e) mutates the shared frame state. e = {tt: cycle phase 0..1, w: 2π·tt, s: strength 0..2, W, H, u: min side, c: colour}
  const GROUPS = [["look", "見た目・色"], ["film", "フィルム・レトロ"]];
  const EFFECTS = [
    {id:"blur", g:"look", n:"ぼかして戻す", needFilter:true, fn:(st, e) => { st.blur = Math.max(st.blur, e.u * .03 * e.s * (.5 - .5 * Math.cos(e.w))); }},
    {id:"focusin", g:"look", n:"ぼけた状態から戻る", needFilter:true, fn:(st, e) => { const rec = Math.min(.8, e.len * .5) / e.len, p = Math.max(0, Math.min(1, (e.tt - (1 - rec)) / rec)); st.blur = Math.max(st.blur, e.u * .04 * e.s * (1 - p * p * (3 - 2 * p))); }},
    {id:"sepia", g:"look", n:"セピア", noS:true, needFilter:true, fn:(st, e) => { st.sepia = 1; }},
    {id:"mono", g:"look", n:"モノクロ", noS:true, needFilter:true, fn:(st, e) => { st.gray = 1; }},

  $("cam").addEventListener("change", e => { S.cam = e.target.value; change(); });
  $("zoom").addEventListener("input", e => { S.zoom = +e.target.value; change(); });
  $("range").addEventListener("input", e => { S.range = +e.target.value; change(); });
  $("aspect").addEventListener("change", e => { S.aspect = e.target.value; change(true); });
  for (const [id, key] of [["aw", "aw"], ["ah", "ah"]])
    $(id).addEventListener("input", e => { const v = Math.round(+e.target.value); if (v >= 1 && v <= 100) { S[key] = v; change(true); } });
  $("size").addEventListener("change", e => { S.size = +e.target.value; change(true); });
  $("fps").addEventListener("change", e => { S.fps = +e.target.value; change(); });
  $("dur").addEventListener("input", e => { S.dur = +e.target.value; change(); });
  $("cap").addEventListener("change", e => { S.cap = e.target.checked; change(); });
  $("wq").addEventListener("input", e => { S.wq = +e.target.value; change(); });
  for (const [id, key, num] of [["fmtSeg", "fmt"], ["cycSeg", "cyc", 1], ["stageSeg", "stage"], ["easeSeg", "ease"], ["modeSeg", "mode"]])
    $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S[key] = num ? +b.dataset.v : b.dataset.v; change(); });
  $("playBtn").addEventListener("click", () => { playing = !playing; syncUi(); });

  // ---- image input ----
  const pick = () => $("file").click();
  $("pickBtn").addEventListener("click", pick); $("pickBtn2").addEventListener("click", pick);
  $("file").addEventListener("change", e => { const f = e.target.files[0]; if (f) load(f); e.target.value = ""; });
  const stg = $("stage");
  ["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { e.preventDefault(); stg.classList.add("drag"); } }));
  ["dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => { if (ev === "dragleave" && e.relatedTarget) return; stg.classList.remove("drag"); }));
  document.addEventListener("drop", e => { const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith("image/")); if (f) { e.preventDefault(); load(f); } });
  document.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/")); if (f) { e.preventDefault(); load(f, "貼り付けた画像"); } });

  function load(file, label) {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      if (!(im.naturalWidth > 0 && im.naturalHeight > 0)) { $("status").textContent = "画像の大きさを取得できませんでした。"; return; }
      img = im; fileBase = (label ? "image" : file.name.replace(/\.[^.]+$/, "")) || "image";
      $("fname").textContent = label || file.name; $("status").textContent = ""; phase = 0;
      change(true);
    };
    im.onerror = () => { URL.revokeObjectURL(url); $("status").textContent = "画像を読み込めませんでした。"; };
    im.src = url;
  }

  // ---- encoders ----
  const crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = u8 => { let c = -1; for (let i = 0; i < u8.length; i++) c = crcT[(c ^ u8[i]) & 255] ^ (c >>> 8); return (~c) >>> 0; };
  const ascii = s => Uint8Array.from(s, ch => ch.charCodeAt(0));
  const cat = arrs => { const o = new Uint8Array(arrs.reduce((a, b) => a + b.length, 0)); let p = 0; for (const a of arrs) { o.set(a, p); p += a.length; } return o; };
  function pngChunk(type, data) {
    const o = new Uint8Array(12 + data.length), dv = new DataView(o.buffer);
    dv.setUint32(0, data.length); o.set(ascii(type), 4); o.set(data, 8); dv.setUint32(8 + data.length, crc32(o.subarray(4, 8 + data.length))); return o;
  }
  function parsePng(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(buf), idat = []; let p = 8, ihdr = null;
    while (p + 8 <= u8.length) {
      const len = dv.getUint32(p), type = String.fromCharCode(...u8.subarray(p + 4, p + 8)), data = u8.subarray(p + 8, p + 8 + len);
      if (type === "IHDR") ihdr = data; else if (type === "IDAT") idat.push(data);
      p += 12 + len;
    }
    if (!ihdr || !idat.length) throw new Error("png");
    return {ihdr, idat: cat(idat)};
  }
  function encodeApng(bufs, delayMs, loops) {
    const fr = bufs.map(parsePng), n = fr.length, w = new DataView(new ArrayBuffer(8));
    const out = [Uint8Array.of(137, 80, 78, 71, 13, 10, 26, 10), pngChunk("IHDR", fr[0].ihdr)];
    w.setUint32(0, n); w.setUint32(4, loops); out.push(pngChunk("acTL", new Uint8Array(w.buffer.slice(0, 8))));
    const hd = new DataView(fr[0].ihdr.buffer, fr[0].ihdr.byteOffset), fw = hd.getUint32(0), fh = hd.getUint32(4);
    let seq = 0;
    fr.forEach((f, i) => {
      const d = new DataView(new ArrayBuffer(26));
      d.setUint32(0, seq++); d.setUint32(4, fw); d.setUint32(8, fh); d.setUint32(12, 0); d.setUint32(16, 0);
      d.setUint16(20, delayMs); d.setUint16(22, 1000); d.setUint8(24, 0); d.setUint8(25, 0);
      out.push(pngChunk("fcTL", new Uint8Array(d.buffer)));
      if (i === 0) out.push(pngChunk("IDAT", f.idat));
      else { const s = new Uint8Array(4); new DataView(s.buffer).setUint32(0, seq++); out.push(pngChunk("fdAT", cat([s, f.idat]))); }
    });
    out.push(pngChunk("IEND", new Uint8Array(0)));
    return new Blob(out, {type:"image/png"});
  }
  const le = (v, n) => Uint8Array.from({length:n}, (_, i) => (v >>> (8 * i)) & 255);
  function parseWebp(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(buf);
    if (String.fromCharCode(...u8.subarray(0, 4)) !== "RIFF" || String.fromCharCode(...u8.subarray(8, 12)) !== "WEBP") throw new Error("webp");
    const chunks = []; let p = 12;
    while (p + 8 <= u8.length) {
      const type = String.fromCharCode(...u8.subarray(p, p + 4)), size = dv.getUint32(p + 4, true), total = 8 + size + (size & 1);
      if (type === "ALPH" || type === "VP8 " || type === "VP8L") { const c = new Uint8Array(total); c.set(u8.subarray(p, Math.min(u8.length, p + total))); chunks.push(c); }
      p += total;
    }
    if (!chunks.length) throw new Error("webp");
    return cat(chunks);
  }
  function encodeWebp(bufs, w, h, delayMs, loops) {
    const anmf = bufs.map(b => {
      const data = parseWebp(b);
      const head = cat([le(0, 3), le(0, 3), le(w - 1, 3), le(h - 1, 3), le(delayMs, 3), Uint8Array.of(2)]);
      return cat([ascii("ANMF"), le(head.length + data.length, 4), head, data]);
    });
    const vp8x = cat([ascii("VP8X"), le(10, 4), Uint8Array.of(0x12, 0, 0, 0), le(w - 1, 3), le(h - 1, 3)]);
    const anim = cat([ascii("ANIM"), le(6, 4), le(0, 4), le(loops, 2)]);
    const body = cat([ascii("WEBP"), vp8x, anim, ...anmf]);
    return new Blob([ascii("RIFF"), le(body.length, 4), body], {type:"image/webp"});
  }
  const toBlob = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
  const wait = () => new Promise(r => requestAnimationFrame(() => r()));
  const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(2) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";

  // ---- make ----
  let resUrl = "", busy = false;
  $("make").addEventListener("click", async () => {
    if (!img || busy) return;
    busy = true; $("make").disabled = true; $("prog").hidden = false;
    const N = Math.max(2, Math.min(240, Math.round(S.dur * S.fps))), delay = Math.round(1000 / S.fps), webp = S.fmt === "webp";
    const LIMIT = 5000000, loops = S.loop ? 0 : 1;
    const qs = webp && S.cap ? [S.wq, 80, 65, 50, 40, 30, 20, 10].filter((q, i, a) => q <= S.wq && a.indexOf(q) === i) : [S.wq];
    try {
      let out = null, usedQ = S.wq;
      for (let qi = 0; qi < qs.length; qi++) {
        const bufs = []; usedQ = qs[qi];
        for (let i = 0; i < N; i++) {
          frame(exc, i / N);
          const blob = await toBlob(EX, webp ? "image/webp" : "image/png", webp ? usedQ / 100 : undefined);
          if (!blob) throw new Error("blob");
          if (webp && blob.type !== "image/webp") throw new Error("nowebp");
          bufs.push(await blob.arrayBuffer());
          $("status").textContent = `フレームを作成中… ${i + 1} / ${N}` + (qi ? `（画質${usedQ}で再調整）` : ""); $("progBar").style.width = ((i + 1) / N * 100) + "%";
          if (i % 4 === 3) await wait();
        }
        $("status").textContent = "まとめています…"; await wait();
        out = webp ? encodeWebp(bufs, W, H, delay, loops) : encodeApng(bufs, delay, loops);
        if (out.size <= LIMIT) break;
      }
      if (resUrl) URL.revokeObjectURL(resUrl);
      resUrl = URL.createObjectURL(out);
      const over = webp && S.cap && out.size > LIMIT;
      $("resMeta").innerHTML = [webp ? "アニメWebP" : "APNG", `${W} × ${H} px`, `${N} コマ`, `${(N * delay / 1000).toFixed(2)} 秒`, fmtSize(out.size), ...(webp ? [usedQ >= 100 ? "ロスレス" : `画質 ${usedQ}`] : [])].map(s => `<span>${s}</span>`).join("");
      const a = $("resSave"); a.href = resUrl; a.download = `${fileBase}_anim.${webp ? "webp" : "png"}`;
      $("result").hidden = false;
      $("status").textContent = over ? "画質を下げても5MBを超えています。大きさ・コマ数・秒数を小さくしてください。" : "作成しました。";
    } catch (e) {
      $("status").textContent = e.message === "nowebp" ? "このブラウザはWebP出力に対応していません。APNGをお使いください。" : "作成に失敗しました。大きさやコマ数を小さくして試してください。";
    } finally { busy = false; $("prog").hidden = true; $("progBar").style.width = "0"; $("make").disabled = !img; }
  });

  applyUi(); syncUi(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
