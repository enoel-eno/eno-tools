<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ログ整形ツール</title>
<meta property="og:type" content="website"><meta property="og:site_name" content="TRPGツール"><meta property="og:title" content="ログ整形ツール"><meta property="og:description" content="ココフォリアのログを、タブごとに絞り込めるHTMLに変換します。"><meta property="og:url" content="https://enoel-eno.github.io/eno-tools/log-formatter.html"><meta property="og:image" content="https://enoel-eno.github.io/eno-tools/ogp/log-formatter.png"><meta name="twitter:card" content="summary_large_image"><meta name="description" content="ココフォリアのログを、タブごとに絞り込めるHTMLに変換します。"><meta name="robots" content="noindex, nofollow"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#1f2328; --muted:#6b7178; --line:#dde1e5;
  --accent:#2b2f36; --accent-ink:#ffffff; --soft:#f0f2f4;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171a; --surface:#1e2125; --ink:#e6e8ea; --muted:#9aa0a6; --line:#30343a;
  --accent:#d5d9de; --accent-ink:#15171a; --soft:#272b30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1e2125; --ink:#e6e8ea; --muted:#9aa0a6; --line:#30343a;
  --accent:#d5d9de; --accent-ink:#15171a; --soft:#272b30; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:22px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,34px);margin:0;letter-spacing:.04em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.lab{font-weight:700;font-size:14px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-family:var(--f-mono);font-size:12px;line-height:1.55;padding:10px}
textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.filebtn{font-family:var(--f-body);font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:5px 11px;cursor:pointer}
button:hover,.filebtn:hover{border-color:var(--accent)}
.filebtn input{display:none}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;border-radius:6px}
button:disabled{opacity:.45;cursor:default}
input[type=checkbox]{accent-color:var(--accent)}
fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:8px;font-size:14px;min-width:0}
legend{font-size:12px;color:var(--muted);padding:0 4px}
fieldset label{display:flex;align-items:center;gap:6px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 10px;border-radius:999px;background:transparent;color:var(--muted);transition:background .15s,color .15s,border-color .15s}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip svg{width:0;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;margin-right:-6px;transition:opacity .15s,width .15s,margin .15s}
.chip[aria-pressed=true] svg{width:14px;opacity:1;margin-right:0}
.chip small{font-family:var(--f-mono);font-size:11px;opacity:.65}
.note{font-size:12px;color:var(--muted);margin:0}
.status{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.status b{color:var(--ink);font-family:var(--f-mono)}
.result{min-width:0}
iframe{width:100%;height:min(78vh,900px);border:1px solid var(--line);border-radius:8px;background:#121212;display:block}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 20px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){header h1{font-size:calc((100vw - 32px)/10);white-space:nowrap}}
</style>
</head>
<body>
<div class="wrap">
  <a href="./" style="display:inline-block;margin-bottom:6px;font-size:13px;color:var(--muted);text-decoration:none">← ツール一覧</a>
  <header>
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:.85em;height:.85em;vertical-align:-.08em;margin-right:.3em"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>ログ整形ツール</h1>
    <p>ココフォリアのログ（HTML）を、タブごとに絞り込めるHTMLに変換します。</p>
  </header>

  <div class="grid">
    <section class="panel" aria-label="入力と設定">
      <div class="field">
        <div class="lab"><label for="src">ログ</label></div>
        <textarea id="src" spellcheck="false" placeholder="ココフォリアのログ（HTML）を貼り付け、またはファイルを開く"></textarea>
        <div class="tools">
          <label class="filebtn">ファイルを開く<input type="file" id="file" accept=".html,.htm,.txt"></label>
          <button type="button" id="clear">クリア</button>
        </div>
      </div>
      <div class="field"><div class="lab">含めるタブ</div><div id="tabBox" class="chips" role="group" aria-label="含めるタブ"></div></div>
      <div class="tools">
        <button type="button" id="allOn">すべて選択</button>
        <button type="button" id="allOff">すべて解除</button>
      </div>
      <div class="status" id="status"></div>
      <div class="tools">
        <button type="button" class="primary" id="save">絞り込み付きHTMLを保存</button>
      </div>
      <p class="note">保存したHTMLには、タブの絞り込みボタンが付きます。見た目は元のログのままです。</p>
    </section>

    <section class="result">
      <div class="empty" id="empty">ログを読み込むと、ここにプレビューが表示されます。</div>
      <iframe id="view" title="プレビュー" hidden></iframe>
    </section>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let doc = null;      // 読み込んだログ
let tabs = [];       // {id, name, count}
let off = new Set(); // 非表示のタブ id
let fileName = 'log';

function parse(text){
  const d = new DOMParser().parseFromString(text, 'text/html');
  return d.querySelector('article.message') ? d : null;
}

function readTabs(){
  const m = new Map();
  doc.querySelectorAll('article.message').forEach(a => {
    const id = a.dataset.channel || '';
    if(!m.has(id)){
      const n = a.querySelector('.channel-name');
      m.set(id, {id, name: n ? n.textContent.trim().replace(/^\[|\]$/g, '') : id, count: 0});
    }
    m.get(id).count++;
  });
  return [...m.values()];
}

// 選択中のタブだけを残した HTML
function filtered(){
  const d = doc.cloneNode(true);
  d.querySelectorAll('article.message').forEach(a => { if(off.has(a.dataset.channel || '')) a.remove(); });
  const kept = tabs.filter(x => !off.has(x.id));
  const t = d.querySelector('.log-title'), title = d.querySelector('title');
  [t, title].forEach(e => { if(e) e.textContent = e.textContent.replace(/\s*\[すべて\]\s*$/, ''); });
  const css = d.createElement('style');
  css.textContent = '.tab-filter{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px max(24px,calc((100% - 960px)/2 + 24px));background:rgba(18,18,18,.88);backdrop-filter:blur(8px);border-bottom:1px solid #262626;font:13px/1.4 system-ui,sans-serif}'
    + '.tab-filter button{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 10px;border:1px solid #3a3a3a;border-radius:999px;background:transparent;color:#999;font:inherit;cursor:pointer;transition:background .15s,color .15s,border-color .15s}'
    + '.tab-filter button:hover{border-color:#777;color:#ddd}'
    + '.tab-filter button[aria-pressed=true]{background:#e8e8e8;border-color:#e8e8e8;color:#161616;font-weight:600}'
    + '.tab-filter button svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;margin-right:-4px;width:0;transition:opacity .15s,width .15s,margin .15s}'
    + '.tab-filter button[aria-pressed=true] svg{opacity:1;width:14px;margin-right:0}'
    + '.tab-filter small{font-size:11px;opacity:.65;font-variant-numeric:tabular-nums}'
    + '.tab-filter button:focus-visible{outline:2px solid #8ab4ff;outline-offset:2px}'
    + 'article.message[hidden]{display:none!important}'
    + '@media (prefers-reduced-motion:reduce){.tab-filter *{transition:none!important}}';
  d.head.append(css);
  const bar = d.createElement('nav');
  bar.className = 'tab-filter';
  bar.setAttribute('aria-label', 'タブの絞り込み');
  bar.innerHTML = kept.map(x =>
    '<button type="button" aria-pressed="true" data-tab="' + esc(x.id) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>' + esc(x.name || '（なし）') + '<small>' + x.count + '</small></button>').join('');
  d.body.prepend(bar);
  const js = d.createElement('script');
  js.textContent = "(function(){var bar=document.querySelector('.tab-filter');function apply(){var on={};bar.querySelectorAll('button').forEach(function(b){on[b.dataset.tab]=b.getAttribute('aria-pressed')==='true'});document.querySelectorAll('article.message').forEach(function(a){a.hidden=!on[a.dataset.channel]})}bar.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');apply()});apply()})();";
  d.body.append(js);
  return '<!DOCTYPE html>\n' + d.documentElement.outerHTML + '\n';
}

function renderTabs(){
  const box = $('#tabBox');
  box.innerHTML = tabs.length ? '' : '<span class="note">ログを読み込むと表示されます</span>';
  tabs.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.id = t.id;
    b.setAttribute('aria-pressed', String(!off.has(t.id)));
    b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>' + esc(t.name || '（なし）') + '<small>' + t.count + '</small>';
    b.addEventListener('click', () => {
      off.has(t.id) ? off.delete(t.id) : off.add(t.id);
      b.setAttribute('aria-pressed', String(!off.has(t.id)));
      refresh();
    });
    box.append(b);
  });
}

function refresh(){
  const raw = $('#src').value.trim();
  const shown = doc ? tabs.filter(t => !off.has(t.id)).reduce((s, t) => s + t.count, 0) : 0;
  $('#status').innerHTML = !raw ? 'ログを貼り付けてください。'
    : !doc ? 'ココフォリアのログ（HTML）として読み取れませんでした。'
    : `全 <b>${tabs.reduce((s, t) => s + t.count, 0)}</b> 件中 <b>${shown}</b> 件を含めています。`;
  $('#save').disabled = !doc || !shown;
  $('#empty').hidden = !!doc;
  $('#view').hidden = !doc;
  if(doc) $('#view').srcdoc = filtered();
}

function load(){
  doc = parse($('#src').value);
  tabs = doc ? readTabs() : [];
  off = new Set();
  renderTabs(); refresh();
}

function setAll(on){
  off = on ? new Set() : new Set(tabs.map(t => t.id));
  $('#tabBox').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(on)));
  refresh();
}

let timer;
$('#src').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 250); });
$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  fileName = f.name.replace(/\.[^.]+$/, '');
  const fr = new FileReader();
  fr.onload = () => { $('#src').value = fr.result; load(); e.target.value = ''; };
  fr.readAsText(f);
});
$('#clear').addEventListener('click', () => { $('#src').value = ''; load(); });
$('#allOn').addEventListener('click', () => setAll(true));
$('#allOff').addEventListener('click', () => setAll(false));
$('#save').addEventListener('click', () => {
  const names = tabs.filter(t => !off.has(t.id)).map(t => t.name).join('・');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([filtered()], {type: 'text/html'}));
  a.download = (off.size ? `${fileName}_${names}` : fileName) + '.html';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

load();
</script>
</body>
</html>
