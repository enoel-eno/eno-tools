<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文字画像メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;900&family=Zen+Maru+Gothic:wght@700&family=Zen+Antique&family=Klee+One:wght@600&family=Kaisei+Decol:wght@700&family=Dela+Gothic+One&family=Reggae+One&family=Rampart+One&family=Potta+One&family=Yusei+Magic&family=Hachi+Maru+Pop&display=swap">
<style>
/* Layout: control sheet on the left, live canvas preview on the right; stacks on phones. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#1f2328; --muted:#6b7178; --line:#dde1e5; --accent:#2b2f36; --accent-fg:#ffffff;
  --f-ui:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-disp:"Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1e2125; --fg:#e6e8ea; --muted:#9aa0a6; --line:#30343a; --accent:#d5d9de; --accent-fg:#15171a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1e2125; --fg:#e6e8ea; --muted:#9aa0a6; --line:#30343a; --accent:#d5d9de; --accent-fg:#15171a; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--f-ui); font-size:14px; line-height:1.6}
.wrap{max-width:1440px; margin:0 auto; padding-block:28px 48px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; gap:20px}
header{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px}
h1{margin:0; font-family:var(--f-disp); font-size:28px; font-weight:800; letter-spacing:.08em; text-wrap:balance}
header p{margin:0; color:var(--muted)}
.grid{display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start}
.controls{flex:1 1 320px; max-width:400px; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 18px; display:flex; flex-direction:column; gap:4px}
.preview{flex:999 1 420px; min-width:0; display:flex; flex-direction:column; gap:12px; position:sticky; top:12px}
@media (max-width:900px){
  .controls{max-width:none}
  .grid{gap:12px}
  .preview{order:-1; flex:1 1 100%; z-index:5; background:var(--bg); padding-block:8px; gap:8px; box-shadow:0 1px 0 var(--line)}
  .preview .stage{height:min(30vh, 260px)}
  .preview canvas{max-height:calc(min(30vh, 260px) - 24px)}
  .preview .bar small{display:none}
  .preview .bar{justify-content:flex-end}
}
fieldset{border:0; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; min-width:0}
.sec{border-top:1px solid var(--line); padding-top:4px}
.sec:first-child{border-top:0; padding-top:0}
.sec > summary{list-style:none; display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px; cursor:pointer; font-size:13px; font-weight:700; letter-spacing:.12em; color:var(--fg); border-radius:6px}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::after{content:""; width:8px; height:8px; border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted); margin-right:4px; transform:rotate(45deg); transition:transform .15s}
.sec:not([open]) > summary::after{transform:rotate(-45deg)}
.sec > summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.sec > fieldset{padding-bottom:14px}
.row{display:flex; gap:10px}
.row > label{flex:1 1 0; min-width:0}
label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted)}
label.inline{flex-direction:row; align-items:center; justify-content:space-between; gap:10px}
textarea, select{font:inherit; font-size:14px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; min-height:40px; width:100%}
textarea{resize:vertical; min-height:84px; line-height:1.5}
textarea:focus-visible, select:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
input[type=range]{width:100%; accent-color:var(--accent)}
input[type=color]{width:56px; height:36px; padding:2px; border:1px solid var(--line); border-radius:6px; background:var(--bg); cursor:pointer}
input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent)}
.seg{display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{flex:1 1 20%; min-height:40px; border:0; background:var(--bg); color:var(--fg); font:inherit; font-size:13px; cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--bg)}
.stage{display:flex; align-items:center; justify-content:center; overflow:hidden; min-height:240px; background:repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0/16px 16px; border-radius:8px; border:1px solid var(--line); padding:12px}
.stage.light{background:#fff}
.stage.dark{background:#111}
canvas{display:block; max-width:100%; max-height:calc(100vh - 220px); min-height:0; width:auto; height:auto; object-fit:contain; margin:auto; box-shadow:0 0 0 1px rgba(128,128,128,.25)}
.bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.bar small{color:var(--muted)}
.btns{display:flex; flex-wrap:wrap; gap:10px}
.btn{min-height:44px; padding:0 22px; border-radius:8px; border:0; background:var(--accent); color:var(--accent-fg); font:inherit; font-weight:700; font-size:15px; letter-spacing:.06em; cursor:pointer}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:500}
.actual{border:1px solid var(--line); border-radius:10px; padding:0; background:var(--panel); color:var(--fg); width:min(96vw,1200px); max-height:92vh}
.actual.confirm{width:min(92vw,380px)}
.actual.confirm form{padding:18px; gap:16px}
.actual.confirm p{margin:0}
.actual.confirm .btns{justify-content:flex-end}
.actual::backdrop{background:rgba(0,0,0,.55)}
.actual form{display:flex; flex-direction:column; max-height:92vh}
.actual header{padding:10px 14px; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line)}
.actual .view{overflow:auto; padding:12px; background:repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0/16px 16px}
.actual .view.light{background:#fff}
.actual .view.dark{background:#111}
.actual .view img{display:block; max-width:none; margin:auto}
.sub{font-size:12px; color:var(--muted); margin:0}
.status{min-height:1.6em; color:var(--muted); font-size:13px; margin:0}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
<meta property="og:type" content="website"><meta property="og:site_name" content="TRPGツール"><meta property="og:title" content="文字画像メーカー"><meta property="og:description" content="文字を入力して、フチ取りや影つきの透過PNG画像を作成できます。"><meta property="og:url" content="https://enoel-eno.github.io/eno-tools/text-image-maker.html"><meta property="og:image" content="https://enoel-eno.github.io/eno-tools/ogp/text-image-maker.png"><meta name="twitter:card" content="summary_large_image"><meta name="description" content="文字を入力して、フチ取りや影つきの透過PNG画像を作成できます。"><meta name="robots" content="noindex, nofollow"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head>
<body>
<div class="wrap">
  <a href="./" style="display:inline-block;margin-bottom:6px;font-size:13px;color:var(--muted);text-decoration:none">← ツール一覧</a>
  <header>
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:.85em;height:.85em;vertical-align:-.08em;margin-right:.3em"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>文字画像メーカー</h1>
    <p>文字を入力して、フチ取りや影つきの透過PNG画像を作成できます。</p>
  </header>

  <div class="grid">
    <form class="controls" id="form" autocomplete="off" onsubmit="return false">
      <details class="sec" open>
        <summary>文字</summary>
        <fieldset aria-label="文字">
          <label for="text">テキスト（改行できます）
            <textarea id="text" spellcheck="false" placeholder="ここにテキストを入力"></textarea>
          </label>
          <label for="font">フォント
            <select id="font"></select>
          </label>
          <div class="seg" role="group" aria-label="書字方向" id="dirSeg">
            <button type="button" data-v="h">横書き</button>
            <button type="button" data-v="v">縦書き</button>
          </div>
          <div class="seg" role="group" aria-label="揃え" id="alignSeg">
            <button type="button" data-v="left">左</button>
            <button type="button" data-v="center">中央</button>
            <button type="button" data-v="right">右</button>
          </div>
          <label for="size">大きさ <span id="sizeVal"></span>
            <input type="range" id="size" min="16" max="400" step="1">
          </label>
          <div class="row">
            <label for="ls">字間 <span id="lsVal"></span>
              <input type="range" id="ls" min="-20" max="100" step="1">
            </label>
            <label for="lh">行間 <span id="lhVal"></span>
              <input type="range" id="lh" min="80" max="250" step="5">
            </label>
          </div>
        </fieldset>
      </details>

      <details class="sec" open>
        <summary>色・フチ・影</summary>
        <fieldset aria-label="色・フチ・影">
          <label class="inline" for="fill">文字色 <input type="color" id="fill"></label>
          <label class="inline" for="strokeOn">フチをつける <input type="checkbox" id="strokeOn"></label>
          <label for="stroke">フチの太さ <span id="strokeVal"></span>
            <input type="range" id="stroke" min="1" max="60" step="1">
          </label>
          <label class="inline" for="strokeColor">フチの色 <input type="color" id="strokeColor"></label>
          <label class="inline" for="shadowOn">影をつける <input type="checkbox" id="shadowOn"></label>
          <label for="shadowBlur">影のぼかし <span id="shadowBlurVal"></span>
            <input type="range" id="shadowBlur" min="0" max="40" step="1">
          </label>
          <div class="row">
            <label for="shadowX">影の左右 <span id="shadowXVal"></span>
              <input type="range" id="shadowX" min="-40" max="40" step="1">
            </label>
            <label for="shadowY">影の上下 <span id="shadowYVal"></span>
              <input type="range" id="shadowY" min="-40" max="40" step="1">
            </label>
          </div>
          <label class="inline" for="shadowColor">影の色 <input type="color" id="shadowColor"></label>
        </fieldset>
      </details>

      <details class="sec" open>
        <summary>背景・余白</summary>
        <fieldset aria-label="背景・余白">
          <label class="inline" for="bgOn">背景（OFFなら透過） <input type="checkbox" id="bgOn"></label>
          <label class="inline" for="bgColor">背景の色 <input type="color" id="bgColor"></label>
          <label class="inline" for="borderOn">枠線 <input type="checkbox" id="borderOn"></label>
          <label class="inline" for="borderColor">枠線の色 <input type="color" id="borderColor"></label>
          <label for="bgBorder">枠線の太さ <span id="bgBorderVal"></span>
            <input type="range" id="bgBorder" min="1" max="60" step="1">
          </label>
          <div class="seg" role="group" aria-label="形" id="shapeSeg">
            <button type="button" data-v="rect">四角</button>
            <button type="button" data-v="round">角丸</button>
          </div>
          <label for="radius">角の丸み <span id="radiusVal"></span>
            <input type="range" id="radius" min="1" max="200" step="1">
          </label>
          <label for="pad">余白 <span id="padVal"></span>
            <input type="range" id="pad" min="0" max="200" step="1">
          </label>
        </fieldset>
      </details>

      <details class="sec" open>
        <summary>プレビュー表示</summary>
        <fieldset aria-label="プレビュー表示">
          <p class="sub">画像には影響しません。見やすい下地を選べます。</p>
          <div class="seg" role="group" aria-label="プレビューの下地" id="stageSeg">
            <button type="button" data-v="check">市松</button>
            <button type="button" data-v="light">白</button>
            <button type="button" data-v="dark">黒</button>
          </div>
        </fieldset>
      </details>
      <div class="sec" style="padding:12px 0 8px"><button type="button" class="btn ghost" id="reset" style="width:100%">初期値に戻す</button></div>
    </form>

    <section class="preview" aria-label="プレビュー">
      <div class="stage" id="stage"><canvas id="cv" width="10" height="10"></canvas></div>
      <div class="bar">
        <small id="dims"></small>
        <div class="btns">
          <button type="button" class="btn ghost" id="actualBtn">実際のサイズを確認</button>
          <button type="button" class="btn ghost" id="copy">コピー</button>
          <button type="button" class="btn" id="save">PNGで保存</button>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </div>
</div>

<dialog class="actual confirm" id="resetDlg" aria-label="初期値に戻す">
  <form method="dialog">
    <p>テキストを含め、すべての設定を初期値に戻します。よろしいですか？</p>
    <div class="btns">
      <button class="btn ghost" value="cancel">キャンセル</button>
      <button class="btn" id="resetOk" value="ok">初期値に戻す</button>
    </div>
  </form>
</dialog>

<dialog class="actual" id="actual" aria-label="実際のサイズ">
  <form method="dialog">
    <header><span id="actualDims"></span><button class="btn ghost" aria-label="閉じる">閉じる</button></header>
    <div class="view" id="actualView"><img id="actualImg" alt="実際のサイズのプレビュー"></div>
  </form>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const FONTS = [
    {n:"明朝（しっぽり）", f:"Shippori Mincho B1", w:800},
    {n:"ゴシック（Zen Kaku）", f:"Zen Kaku Gothic New", w:900},
    {n:"丸ゴシック", f:"Zen Maru Gothic", w:700},
    {n:"アンティーク", f:"Zen Antique", w:400},
    {n:"手書き風（Klee）", f:"Klee One", w:600},
    {n:"デコ明朝（Kaisei Decol）", f:"Kaisei Decol", w:700},
    {n:"極太ゴシック（Dela）", f:"Dela Gothic One", w:400},
    {n:"レゲエ", f:"Reggae One", w:400},
    {n:"ランパート", f:"Rampart One", w:400},
    {n:"ポッタ", f:"Potta One", w:400},
    {n:"ユウセイマジック", f:"Yusei Magic", w:400},
    {n:"ハチマルポップ", f:"Hachi Maru Pop", w:400},
  ];
  const DEFAULTS = {text:"", font:0, dir:"h", align:"center", size:30, ls:0, lh:130,
    fill:"#000000", strokeOn:false, stroke:1, strokeColor:"#ffffff", shadowOn:false, shadowBlur:8, shadowX:6, shadowY:6, shadowColor:"#000000",
    bgOn:false, bgColor:"#ffffff", borderOn:false, borderColor:"#000000", bgBorder:3, shape:"rect", radius:40, pad:24, stage:"check"};
  const KEY = "eno-text-image-maker";
  let S = {...DEFAULTS};
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  if (!FONTS[S.font]) S.font = 0;

  const cv = $("cv"), ctx = cv.getContext("2d");
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  // ---- controls ----
  FONTS.forEach((o, i) => { const op = document.createElement("option"); op.value = i; op.textContent = o.n; op.style.fontFamily = `"${o.f}"`; $("font").append(op); });
  const ranges = {size:"", ls:"", lh:"%", stroke:"", shadowBlur:"", shadowX:"", shadowY:"", bgBorder:"", radius:"", pad:""};
  const checks = ["strokeOn", "shadowOn", "bgOn", "borderOn"], colors = ["fill", "strokeColor", "shadowColor", "bgColor", "borderColor"];
  const applyUi = () => {
    $("text").value = S.text; $("font").value = S.font;
    for (const k in ranges) $(k).value = S[k];
    checks.forEach(k => $(k).checked = S[k]);
    colors.forEach(k => $(k).value = S[k]);
  };
  applyUi();

  function syncUi() {
    for (const k in ranges) $(k + "Val").textContent = S[k] + (ranges[k] || "px");
    for (const [id, key] of [["dirSeg", "dir"], ["alignSeg", "align"], ["shapeSeg", "shape"], ["stageSeg", "stage"]])
      $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S[key]));
    $("alignSeg").querySelectorAll("button").forEach(b => {
      b.textContent = {left:S.dir === "v" ? "上" : "左", center:"中央", right:S.dir === "v" ? "下" : "右"}[b.dataset.v];
    });
    $("stage").className = "stage" + (S.stage === "check" ? "" : " " + S.stage);
    $("stroke").disabled = $("strokeColor").disabled = !S.strokeOn;
    ["shadowBlur", "shadowX", "shadowY", "shadowColor"].forEach(k => $(k).disabled = !S.shadowOn);
    $("bgColor").disabled = !S.bgOn;
    $("borderColor").disabled = $("bgBorder").disabled = !S.borderOn;
    $("radius").disabled = S.shape !== "round";
  }

  $("text").addEventListener("input", e => { S.text = e.target.value; change(); });
  $("font").addEventListener("change", e => { S.font = +e.target.value; change(); });
  for (const k in ranges) $(k).addEventListener("input", e => { S[k] = +e.target.value; change(); });
  checks.forEach(k => $(k).addEventListener("change", e => { S[k] = e.target.checked; change(); }));
  colors.forEach(k => $(k).addEventListener("input", e => { S[k] = e.target.value; change(); }));
  for (const [id, key] of [["dirSeg", "dir"], ["alignSeg", "align"], ["shapeSeg", "shape"], ["stageSeg", "stage"]])
    $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S[key] = b.dataset.v; change(); });

  // in-page dialog instead of confirm(), which embedded browsers may block
  $("reset").addEventListener("click", () => $("resetDlg").showModal());
  $("resetOk").addEventListener("click", () => { S = {...DEFAULTS}; applyUi(); change(); });

  function change() { syncUi(); save(); schedule(); }

  // ---- rendering ----
  const ROTATE = new Set([..."ー―—–…〜～−－-=＝()（）[]［］「」『』【】〈〉《》〔〕｛｝{}<>＜＞→←↑↓"]);
  const SHIFT = new Set([..."、。，．,."]);
  let token = 0, raf = 0;
  function schedule() { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }

  async function render() {
    const my = ++token;
    const fo = FONTS[S.font];
    const font = `${fo.w} ${S.size}px "${fo.f}", "Hiragino Sans", "Yu Gothic", sans-serif`;
    try { await document.fonts.load(font, S.text || "あ"); } catch (e) {}
    if (my !== token) return;

    const lines = S.text.split("\n");
    const vertical = S.dir === "v";
    const size = S.size, ls = S.ls, lineStep = size * S.lh / 100;
    ctx.font = font;
    const adv = ch => vertical ? size + ls : ctx.measureText(ch).width + ls;
    const chars = lines.map(l => [...l]);
    const lens = chars.map(cs => Math.max(0, cs.reduce((a, c) => a + adv(c), 0) - (cs.length ? ls : 0)));
    const longest = Math.max(size, ...lens);
    const n = lines.length;

    const edge = (S.strokeOn ? S.stroke : 0) + (S.shadowOn ? S.shadowBlur * 1.5 + Math.max(Math.abs(S.shadowX), Math.abs(S.shadowY)) : 0);
    const round = S.shape === "round";
    const bw = S.borderOn ? S.bgBorder : 0;
    const inset = S.pad + Math.ceil(edge) + bw + (round ? Math.ceil(S.radius * 0.29) : 0);
    const bodyW = vertical ? (n - 1) * lineStep + size : longest;
    const bodyH = vertical ? longest : (n - 1) * lineStep + size;
    const W = Math.max(1, Math.ceil(bodyW + inset * 2)), H = Math.max(1, Math.ceil(bodyH + inset * 2));
    if (W * H > 64e6) { $("status").textContent = "画像が大きすぎます。大きさを小さくしてください。"; return; }
    cv.width = W; cv.height = H;
    ctx.clearRect(0, 0, W, H);
    const r = round ? Math.min(S.radius, W / 2, H / 2) : 0;
    const box = (o, rad) => { ctx.beginPath(); ctx.roundRect(o, o, W - o * 2, H - o * 2, Math.max(0, rad)); };
    if (S.bgOn) { box(0, r); ctx.fillStyle = S.bgColor; ctx.fill(); }
    if (bw) { box(bw / 2, r - bw / 2); ctx.strokeStyle = S.borderColor; ctx.lineWidth = bw; ctx.stroke(); }
    ctx.font = font; ctx.lineJoin = "round"; ctx.miterLimit = 2; ctx.textBaseline = "alphabetic";

    // glyph placement list, shared by every paint pass
    const glyphs = [];
    lines.forEach((_, li) => {
      const cs = chars[li], len = lens[li];
      const off = S.align === "left" ? 0 : S.align === "right" ? longest - len : (longest - len) / 2;
      let p = off;
      cs.forEach(c => {
        if (vertical) {
          const cx = inset + bodyW - size / 2 - li * lineStep, cy = inset + p + size / 2;
          glyphs.push({c, cx, cy});
        } else {
          glyphs.push({c, x: inset + p, base: inset + li * lineStep});
        }
        p += adv(c);
      });
    });

    const draw = (fn) => glyphs.forEach(g => {
      if (g.c === " " || g.c === "　") return;
      ctx.save();
      if (vertical) {
        // centre the glyph in its square cell; some marks rotate or shift to the cell's upper right
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        let x = g.cx, y = g.cy + size * 0.04;
        if (SHIFT.has(g.c)) { x += size * 0.5; y -= size * 0.5; }
        ctx.translate(x, y);
        if (ROTATE.has(g.c)) ctx.rotate(Math.PI / 2);
        fn(g.c, 0, 0);
      } else {
        ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
        fn(g.c, g.x, g.base + size * 0.86);
      }
      ctx.restore();
    });

    const strokeW = S.strokeOn ? S.stroke * 2 : 0;
    if (S.shadowOn) {
      ctx.shadowColor = S.shadowColor; ctx.shadowBlur = S.shadowBlur;
      ctx.shadowOffsetX = S.shadowX; ctx.shadowOffsetY = S.shadowY;
    }
    if (strokeW > 0) {
      ctx.strokeStyle = S.strokeColor; ctx.lineWidth = strokeW;
      draw((c, x, y) => ctx.strokeText(c, x, y));
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetX = ctx.shadowOffsetY = 0;
    }
    ctx.fillStyle = S.fill;
    draw((c, x, y) => ctx.fillText(c, x, y));

    $("dims").textContent = `${W} × ${H} px`;
    $("status").textContent = "";
    $("save").disabled = $("copy").disabled = $("actualBtn").disabled = !S.text.trim();
  }

  // ---- output ----
  const toBlob = () => new Promise(r => cv.toBlob(r, "image/png"));
  $("save").addEventListener("click", async () => {
    const blob = await toBlob(); if (!blob) return;
    const name = (S.text.trim().split("\n")[0].replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 24)) || "text";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `${name}.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    $("status").textContent = "保存しました。";
  });
  $("actualBtn").addEventListener("click", async () => {
    const blob = await toBlob(); if (!blob) return;
    const img = $("actualImg"); if (img.src) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(blob);
    $("actualDims").textContent = `実際のサイズ ${cv.width} × ${cv.height} px`;
    $("actualView").className = "view" + (S.stage === "check" ? "" : " " + S.stage);
    $("actual").showModal();
  });
  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.write([new ClipboardItem({"image/png": toBlob()})]);
      $("status").textContent = "クリップボードにコピーしました。";
    } catch (e) { $("status").textContent = "コピーできませんでした。「PNGで保存」をお使いください。"; }
  });

  document.fonts.addEventListener?.("loadingdone", schedule);
  syncUi(); render();
})();
</script>
</body>
</html>
